<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">az-compliance-baseline-terraform architecture</title>
  <desc id="desc">Management group hierarchy on the left, Azure Policy and Microsoft Defender for Cloud control planes in the centre and right, and the audit log flow from resources through Log Analytics into an immutable WORM archive and an external SIEM across the bottom.</desc>

  <defs>
    <style>
      .f     { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .h1    { font-size: 21px; font-weight: 700; fill: #0f172a; }
      .sub   { font-size: 12.5px; fill: #52607a; }
      .panel { font-size: 13px; font-weight: 700; letter-spacing: .4px; }
      .lbl   { font-size: 12px; fill: #1f2937; }
      .lblb  { font-size: 12px; font-weight: 600; fill: #0f172a; }
      .sm    { font-size: 10.5px; fill: #5b6779; }
      .smb   { font-size: 10.5px; font-weight: 600; fill: #334155; }
      .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.5px; fill: #334155; }
      .monow { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10px; fill: #64748b; }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowViolet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="1200" height="800" fill="#f6f8fb"/>

  <!-- ================= header ================= -->
  <text class="f h1" x="24" y="34">az-compliance-baseline-terraform</text>
  <text class="f sub" x="24" y="55">FedRAMP Rev 5 (Moderate / High) &#183; NIST SP 800-53 Rev 5 &#183; CIS Microsoft Azure Foundations v3.0.0 &#8212; 74 controls, every one backed by a Terraform address</text>
  <text class="f sm" x="1176" y="34" text-anchor="end">Dashed border = gated by an enable_* switch or by deployment_scope</text>
  <text class="f sm" x="1176" y="52" text-anchor="end">Nothing in this diagram has been applied against a real tenant</text>

  <!-- ================= panel A : management groups ================= -->
  <rect x="24" y="74" width="360" height="300" rx="8" fill="#ffffff" stroke="#d7dee8"/>
  <rect x="24" y="74" width="360" height="26" rx="8" fill="#fdf3e3"/>
  <rect x="24" y="92" width="360" height="8" fill="#fdf3e3"/>
  <text class="f panel" x="38" y="92" fill="#92500b">MANAGEMENT GROUP HIERARCHY</text>
  <text class="f sm" x="38" y="117">The enforcement topology. AC-3, CM-2, SC-7.</text>

  <!-- tenant root (not managed) -->
  <rect x="38" y="128" width="330" height="30" rx="5" fill="#fbfcfe" stroke="#c2cbd8" stroke-dasharray="4 3"/>
  <text class="f lbl" x="50" y="141">Tenant Root Group</text>
  <text class="f sm" x="50" y="153">deliberately never written to &#8212; a one-way door</text>

  <path d="M 56 158 L 56 176" stroke="#b45309" fill="none" marker-end="url(#arrow)"/>

  <rect x="46" y="176" width="322" height="28" rx="5" fill="#fdf6ea" stroke="#e2b471"/>
  <text class="f lblb" x="58" y="194">mg-&lt;prefix&gt;-root  &#183;  intermediate root, policy scope</text>

  <!-- children -->
  <path d="M 62 204 L 62 316" stroke="#e2b471" fill="none"/>

  <path d="M 62 222 L 78 222" stroke="#e2b471" fill="none"/>
  <rect x="78" y="210" width="290" height="24" rx="4" fill="#ffffff" stroke="#dfe5ee"/>
  <text class="f lbl" x="88" y="226">platform &#8212; logging, keys, connectivity</text>

  <path d="M 62 250 L 78 250" stroke="#e2b471" fill="none"/>
  <rect x="78" y="238" width="290" height="52" rx="4" fill="#ffffff" stroke="#dfe5ee"/>
  <text class="f lbl" x="88" y="254">landing-zones</text>
  <rect x="98" y="260" width="126" height="22" rx="4" fill="#eef4ff" stroke="#bcd0f5"/>
  <text class="f smb" x="108" y="275">prod &#183; full deny set</text>
  <rect x="232" y="260" width="128" height="22" rx="4" fill="#f4f6f9" stroke="#dfe5ee"/>
  <text class="f smb" x="242" y="275">nonprod &#183; audit set</text>

  <path d="M 62 306 L 78 306" stroke="#e2b471" fill="none"/>
  <rect x="78" y="294" width="290" height="24" rx="4" fill="#ffffff" stroke="#dfe5ee" stroke-dasharray="4 3"/>
  <text class="f lbl" x="88" y="310">sandbox &#8212; outside the authorization boundary</text>

  <path d="M 62 338 L 78 338" stroke="#e2b471" fill="none"/>
  <rect x="78" y="326" width="290" height="24" rx="4" fill="#ffffff" stroke="#dfe5ee"/>
  <text class="f lbl" x="88" y="342">decommissioned &#8212; MP-6 disposal trail</text>

  <text class="f monow" x="38" y="366">deployment_scope = "single_subscription" skips this entire panel</text>

  <!-- ================= panel B : policy control plane ================= -->
  <rect x="402" y="74" width="382" height="300" rx="8" fill="#ffffff" stroke="#d7dee8"/>
  <rect x="402" y="74" width="382" height="26" rx="8" fill="#eaf0fe"/>
  <rect x="402" y="92" width="382" height="8" fill="#eaf0fe"/>
  <text class="f panel" x="416" y="92" fill="#1d4ed8">AZURE POLICY &#8212; PREVENTIVE + EVALUATIVE</text>
  <text class="f sm" x="416" y="117">CA-2, CA-7, CM-6, CM-7. Policy blocks; Defender notices.</text>

  <rect x="416" y="128" width="354" height="70" rx="5" fill="#f7faff" stroke="#c3d4f7"/>
  <text class="f lblb" x="428" y="145">Built-in regulatory initiatives</text>
  <text class="f sm" x="428" y="160">FedRAMP Moderate &#8212; OR &#8212; FedRAMP High &#183; selected by one variable</text>
  <text class="f sm" x="428" y="174">NIST SP 800-53 Rev 5 &#183; Microsoft Cloud Security Benchmark</text>
  <text class="f sm" x="428" y="188" fill="#b45309">CIS Azure v3.0.0 &#8212; GUID unverified, skipped until supplied</text>

  <rect x="416" y="206" width="354" height="72" rx="5" fill="#ffffff" stroke="#dfe5ee"/>
  <text class="f lblb" x="428" y="223">Custom guardrails &#183; 6 hard denials the built-ins only audit</text>
  <text class="f mono" x="428" y="239">allowed-regions &#183; allowed-vm-skus &#183; required-tags</text>
  <text class="f mono" x="428" y="254">storage-min-tls &#183; deny-public-blob &#183; deny-public-ip-nic</text>
  <text class="f sm" x="428" y="270">effect parameter: Audit &#8594; observe blast radius &#8594; Deny</text>

  <rect x="416" y="286" width="172" height="50" rx="5" fill="#ffffff" stroke="#dfe5ee"/>
  <text class="f lblb" x="426" y="303">DINE diagnostics</text>
  <text class="f sm" x="426" y="317">5 resource types &#8594;</text>
  <text class="f sm" x="426" y="330">central workspace</text>

  <rect x="598" y="286" width="172" height="50" rx="5" fill="#ffffff" stroke="#dfe5ee"/>
  <text class="f lblb" x="608" y="303">Remediation identity</text>
  <text class="f sm" x="608" y="317">one user-assigned MI,</text>
  <text class="f sm" x="608" y="330">scoped &#8212; never tenant root</text>

  <rect x="416" y="344" width="354" height="20" rx="4" fill="#fff7f6" stroke="#f0c4bf"/>
  <text class="f smb" x="426" y="358" fill="#9b2c22">Exemptions require a justification and an expiry, or they do not exist (CA-5)</text>

  <!-- ================= panel C : defender ================= -->
  <rect x="802" y="74" width="374" height="300" rx="8" fill="#ffffff" stroke="#d7dee8" stroke-dasharray="6 4"/>
  <rect x="802" y="74" width="374" height="26" rx="8" fill="#f2ecfd"/>
  <rect x="802" y="92" width="374" height="8" fill="#f2ecfd"/>
  <text class="f panel" x="816" y="92" fill="#6d28d9">DEFENDER FOR CLOUD &#8212; DETECTIVE</text>
  <text class="f sm" x="816" y="117">RA-5, SI-3, SI-4, SI-7, IR-6. Every plan is metered; all default off.</text>

  <rect x="816" y="128" width="346" height="96" rx="5" fill="#fbfaff" stroke="#d9cbf6"/>
  <text class="f lblb" x="826" y="145">Plans, each behind its own enable_* switch</text>
  <text class="f mono" x="826" y="162">Servers (P1 Moderate / P2 High)   Storage (+ malware @ High)</text>
  <text class="f mono" x="826" y="177">SQL &#183; SQL-on-VM                   Containers</text>
  <text class="f mono" x="826" y="192">Key Vault                         Resource Manager</text>
  <text class="f mono" x="826" y="207">App Service                       Open-source relational DB</text>
  <text class="f sm" x="826" y="220" fill="#9b2c22">All nine enabled across a real estate is a four-to-five figure monthly bill</text>

  <rect x="816" y="232" width="167" height="58" rx="5" fill="#ffffff" stroke="#dfe5ee"/>
  <text class="f lblb" x="826" y="249">Security contacts</text>
  <text class="f sm" x="826" y="264">IR-6 &#8212; an alert nobody</text>
  <text class="f sm" x="826" y="278">is paged for is a log line</text>

  <rect x="995" y="232" width="167" height="58" rx="5" fill="#ffffff" stroke="#dfe5ee"/>
  <text class="f lblb" x="1005" y="249">Custom assessment</text>
  <text class="f sm" x="1005" y="264">flags WORM policies</text>
  <text class="f sm" x="1005" y="278">left in Unlocked state</text>

  <rect x="816" y="298" width="346" height="60" rx="5" fill="#ffffff" stroke="#dfe5ee"/>
  <text class="f lblb" x="826" y="315">Continuous export</text>
  <text class="f sm" x="826" y="330">Alerts &#183; Assessments &#183; SubAssessments &#183; SecureScore &#183; RegCompliance</text>
  <text class="f sm" x="826" y="346">&#8594; Log Analytics (correlation)   &#8594; Event Hub (SIEM, AU-9(2))</text>

  <!-- control-plane arrows into the audit flow -->
  <path d="M 593 374 L 593 404" stroke="#2563eb" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M 989 374 L 989 404" stroke="#7c3aed" fill="none" marker-end="url(#arrowViolet)"/>

  <!-- ================= audit flow ================= -->
  <rect x="24" y="404" width="1152" height="222" rx="8" fill="#ffffff" stroke="#d7dee8"/>
  <rect x="24" y="404" width="1152" height="26" rx="8" fill="#e7f5f2"/>
  <rect x="24" y="422" width="1152" height="8" fill="#e7f5f2"/>
  <text class="f panel" x="38" y="422" fill="#0f766e">AUDIT RECORD FLOW &#8212; AU-2, AU-6, AU-9, AU-11, AU-12</text>
  <text class="f sm" x="1162" y="422" text-anchor="end">retention and replication are selected by fedramp_baseline</text>

  <!-- stage 1 -->
  <rect x="44" y="452" width="176" height="76" rx="6" fill="#ffffff" stroke="#dfe5ee"/>
  <text class="f lblb" x="56" y="472">In-scope resources</text>
  <text class="f sm" x="56" y="489">Key Vault &#183; NSG &#183; SQL</text>
  <text class="f sm" x="56" y="503">App Service &#183; Public IP</text>
  <text class="f sm" x="56" y="518">+ subscription Activity Log</text>

  <path d="M 220 490 L 258 490" stroke="#0f766e" fill="none" marker-end="url(#arrowTeal)"/>

  <!-- stage 2 -->
  <rect x="258" y="452" width="176" height="76" rx="6" fill="#f6fbfa" stroke="#a9d6cd"/>
  <text class="f lblb" x="270" y="472">Diagnostic settings</text>
  <text class="f sm" x="270" y="489">attached by DINE policy,</text>
  <text class="f sm" x="270" y="503">not by hand</text>
  <text class="f monow" x="270" y="519">categoryGroup: allLogs</text>

  <path d="M 434 490 L 472 490" stroke="#0f766e" fill="none" marker-end="url(#arrowTeal)"/>

  <!-- stage 3 -->
  <rect x="472" y="444" width="200" height="92" rx="6" fill="#eef8f6" stroke="#5fae9f"/>
  <text class="f lblb" x="484" y="464">Log Analytics workspace</text>
  <text class="f sm" x="484" y="481">interactive retention</text>
  <text class="f mono" x="484" y="497">Moderate 365d  &#183;  High 730d</text>
  <text class="f sm" x="484" y="514">local auth disabled &#183; RBAC</text>
  <text class="f sm" x="484" y="529">queried for AU-6 review</text>

  <path d="M 672 470 L 712 470" stroke="#0f766e" fill="none" marker-end="url(#arrowTeal)"/>
  <path d="M 672 512 L 712 512" stroke="#64748b" fill="none" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- stage 4a : WORM -->
  <rect x="712" y="440" width="228" height="62" rx="6" fill="#eef8f6" stroke="#5fae9f"/>
  <text class="f lblb" x="724" y="459">Immutable WORM archive</text>
  <text class="f mono" x="724" y="476">Moderate 1095d GRS &#183; High 2555d RAGRS</text>
  <text class="f sm" x="724" y="492" fill="#9b2c22">created Unlocked &#8212; locking is a manual, irreversible step</text>

  <!-- stage 4b : event hub -->
  <rect x="712" y="506" width="228" height="52" rx="6" fill="#ffffff" stroke="#dfe5ee" stroke-dasharray="4 3"/>
  <text class="f lblb" x="724" y="525">Event Hub &#8594; external SIEM</text>
  <text class="f sm" x="724" y="541">AU-9(2): a copy the subscription</text>
  <text class="f sm" x="724" y="553">owner cannot administer</text>

  <path d="M 940 470 L 978 470" stroke="#0f766e" fill="none" marker-end="url(#arrowTeal)"/>

  <!-- stage 5 : keys -->
  <rect x="978" y="440" width="180" height="118" rx="6" fill="#fffaf4" stroke="#e6c79a"/>
  <text class="f lblb" x="990" y="459">Key Vault (Premium)</text>
  <text class="f sm" x="990" y="476">RBAC mode &#183; purge protection</text>
  <text class="f sm" x="990" y="490">private endpoint only</text>
  <text class="f mono" x="990" y="507">RSA-HSM 3072 / 4096</text>
  <text class="f mono" x="990" y="522">rotate P365D / P180D</text>
  <text class="f sm" x="990" y="539">CMK for archive, disks, SQL</text>
  <text class="f sm" x="990" y="552">MP-6: destroy key = sanitise</text>

  <!-- alerting strip -->
  <rect x="44" y="546" width="628" height="64" rx="6" fill="#fdfaf7" stroke="#e6d0c0"/>
  <text class="f lblb" x="56" y="565">Activity Log alerts &#8212; AU-6(1), SI-4(5), CIS 5.2</text>
  <text class="f mono" x="56" y="582">policyAssignments/write &#183; policyAssignments/delete &#183; networkSecurityGroups/write</text>
  <text class="f mono" x="56" y="597">securityRules/write &#183; vaults/delete &#183; pricings/write &#183; roleAssignments/write &#183; diagnosticSettings/delete</text>

  <!-- ================= footer : baseline switch + scope ================= -->
  <rect x="24" y="644" width="740" height="132" rx="8" fill="#ffffff" stroke="#d7dee8"/>
  <text class="f panel" x="38" y="666" fill="#0f172a">WHAT fedramp_baseline ACTUALLY CHANGES</text>

  <text class="f smb" x="38" y="690">parameter</text>
  <text class="f smb" x="330" y="690">moderate</text>
  <text class="f smb" x="540" y="690">high</text>
  <path d="M 38 696 L 750 696" stroke="#e2e8f0"/>

  <text class="f sm" x="38" y="712">regulatory initiative assigned</text>
  <text class="f mono" x="330" y="712">FedRAMP Moderate</text>
  <text class="f mono" x="540" y="712">FedRAMP High</text>

  <text class="f sm" x="38" y="728">workspace retention / WORM window</text>
  <text class="f mono" x="330" y="728">365d / 1095d</text>
  <text class="f mono" x="540" y="728">730d / 2555d</text>

  <text class="f sm" x="38" y="744">archive replication</text>
  <text class="f mono" x="330" y="744">GRS</text>
  <text class="f mono" x="540" y="744">RAGRS (readable secondary)</text>

  <text class="f sm" x="38" y="760">CMK size / rotation &#183; disk encryption</text>
  <text class="f mono" x="330" y="760">3072 / P365D / CMK</text>
  <text class="f mono" x="540" y="760">4096 / P180D / platform+CMK</text>

  <text class="f sm" x="38" y="772" fill="#5b6779">Defender for Servers: P1 (agentless) at Moderate, P2 (VA + file integrity monitoring) at High.</text>

  <rect x="780" y="644" width="396" height="132" rx="8" fill="#ffffff" stroke="#d7dee8"/>
  <text class="f panel" x="794" y="666" fill="#0f172a">DELIBERATELY OUT OF SCOPE</text>
  <text class="f sm" x="794" y="688">Entra ID Conditional Access, PIM eligibility, access reviews and</text>
  <text class="f sm" x="794" y="703">authentication methods are a separate control plane with a separate</text>
  <text class="f sm" x="794" y="718">blast radius. They live in az-iam-conditional-pim, cross-referenced</text>
  <text class="f sm" x="794" y="733">rather than duplicated here.</text>
  <text class="f sm" x="794" y="756" fill="#9b2c22">This repo is plan-verified only. No apply has ever run against a</text>
  <text class="f sm" x="794" y="770" fill="#9b2c22">real tenant. See "What is and is not verified" in the README.</text>
</svg>

# Single machine-readable source of truth for every compliance claim this repo
# makes. CONTROLS.md is generated from this file; CI fails if the two disagree or
# if any `implementation` address stops existing in terraform/.
#
# Rules for adding a control here:
#   1. It must name a Terraform address that exists. No aspirational entries.
#   2. It must map to at least one real framework control ID.
#   3. If it has a caveat, the caveat goes in `notes` and gets rendered.

metadata:
  cloud: azure
  cloud_name: "Microsoft Azure"

  frameworks:
    fedramp:
      name: "FedRAMP Rev 5 (Moderate / High)"
      short: "FedRAMP R5"
      version: "Rev 5"
    nist_800_53_r5:
      name: "NIST SP 800-53 Rev 5"
      short: "NIST R5"
      version: "Rev 5"
    cis:
      name: "CIS Microsoft Azure Foundations Benchmark"
      short: "CIS Azure v3.0.0"
      version: "v3.0.0"

  framework_notes:
    - "FedRAMP Rev 5 is a profile of NIST SP 800-53 Rev 5, so the control identifiers in the two columns are largely the same by construction. The FedRAMP column is populated only where the control appears in the Moderate or High baseline; a NIST-only entry means the control is in the catalog but not in the FedRAMP baseline this repo targets."
    - "CIS references are given at section granularity (for example `6.1`, `3.12`) rather than at full recommendation granularity. Sub-numbering shifted between CIS Azure Foundations v2.0.0 and v3.0.0, and citing a precise recommendation number I have not re-verified against the published v3.0.0 PDF would be worse than citing the section. Verify against the benchmark before quoting these in an assessment package."
    - "The CIS Microsoft Azure Foundations v3.0.0 built-in initiative is NOT assigned by default: this repo does not ship a verified policy set definition GUID for it. See POL-004 and the `initiatives_requiring_guid_verification` output. Until you supply the GUID, CIS coverage in this repo comes from the custom guardrail policies only."
    - "Entra ID controls -- Conditional Access, PIM, access reviews, authentication methods -- are deliberately absent. They are a separate control plane with a separate provider and separate blast radius, and they live in the author's `az-iam-conditional-pim` repo. The IAM- controls here cover Azure RBAC role assignments only."

controls:
  # =========================================================================
  # MG - management group hierarchy: the scope everything else attaches to
  # =========================================================================
  - id: MG-001
    title: "Intermediate root management group owned by the baseline"
    module: management-groups
    enforcement: foundational
    frameworks:
      fedramp: [CM-2, AC-3]
      nist_800_53_r5: [CM-2, AC-3, PM-5]
      cis: ["1"]
    implementation:
      - management-groups:azurerm_management_group.root
    demo_safe: false
    billable: false
    notes: "Deliberately not the tenant root group. Policy written at the tenant root applies to every future subscription including ones the platform team does not own, and cannot be scoped away afterwards."

  - id: MG-002
    title: "Platform management group isolating shared services"
    module: management-groups
    enforcement: foundational
    frameworks:
      fedramp: [CM-2, CM-5, SC-7]
      nist_800_53_r5: [CM-2, CM-5, SC-7]
      cis: ["1"]
    implementation:
      - management-groups:azurerm_management_group.platform
    demo_safe: false
    billable: false

  - id: MG-003
    title: "Production / non-production landing zone separation"
    module: management-groups
    enforcement: foundational
    frameworks:
      fedramp: [CM-2, SC-7, CM-4]
      nist_800_53_r5: [CM-2, CM-4, SC-7]
      cis: ["1"]
    implementation:
      - management-groups:azurerm_management_group.landing_zones
      - management-groups:azurerm_management_group.prod
      - management-groups:azurerm_management_group.nonprod
    demo_safe: false
    billable: false
    notes: "The split is what makes a strict production deny-set politically survivable: engineering keeps a place to move fast, and it is not inside the authorization boundary's prod scope."

  - id: MG-004
    title: "Sandbox management group declared outside the authorization boundary"
    module: management-groups
    enforcement: foundational
    frameworks:
      fedramp: [CA-3, SA-9]
      nist_800_53_r5: [CA-3, SA-9, PL-2]
      cis: ["1"]
    implementation:
      - management-groups:azurerm_management_group.sandbox
    demo_safe: false
    billable: false
    notes: "Naming out-of-boundary scope explicitly is what lets an assessor accept 'not in scope' instead of treating every subscription in the tenant as in scope."

  - id: MG-005
    title: "Decommissioned management group preserving the disposal audit trail"
    module: management-groups
    enforcement: foundational
    frameworks:
      fedramp: [MP-6]
      nist_800_53_r5: [MP-6, SR-12, CM-8]
      cis: []
    implementation:
      - management-groups:azurerm_management_group.decommissioned
    demo_safe: false
    billable: false

  - id: MG-006
    title: "Additive subscription placement into the hierarchy"
    module: management-groups
    enforcement: foundational
    frameworks:
      fedramp: [CM-8, CM-2]
      nist_800_53_r5: [CM-8, CM-2]
      cis: ["1"]
    implementation:
      - management-groups:azurerm_management_group_subscription_association.this
    demo_safe: false
    billable: false
    notes: "Uses the association resource rather than the authoritative `subscription_ids` argument, which would silently evict any subscription Terraform does not know about."

  # =========================================================================
  # POL - Azure Policy: preventive guardrails and regulatory initiatives
  # =========================================================================
  - id: POL-001
    title: "FedRAMP baseline initiative assigned at management group scope"
    module: policy
    enforcement: detective
    frameworks:
      fedramp: [CA-2, CA-7, CM-6]
      nist_800_53_r5: [CA-2, CA-7, CM-6, PM-31]
      cis: ["2"]
    implementation:
      - policy:azurerm_management_group_policy_assignment.regulatory
      - root:module.policy
    demo_safe: false
    billable: false
    notes: "Which initiative is assigned -- FedRAMP Moderate or FedRAMP High -- is selected by var.fedramp_baseline. Only one is ever assigned; assigning both produces duplicated DINE remediations and a dashboard that double-counts findings."

  - id: POL-002
    title: "Same regulatory initiatives assignable at subscription scope"
    module: policy
    enforcement: detective
    frameworks:
      fedramp: [CA-2, CA-7]
      nist_800_53_r5: [CA-2, CA-7]
      cis: ["2"]
    implementation:
      - policy:azurerm_subscription_policy_assignment.regulatory
    demo_safe: true
    billable: false
    notes: "Lets the whole baseline be evaluated by someone who does not own the tenant root group. Loses inheritance to future subscriptions."

  - id: POL-003
    title: "NIST SP 800-53 Rev 5 initiative assigned alongside the FedRAMP baseline"
    module: policy
    enforcement: detective
    frameworks:
      fedramp: [CA-2, CA-7]
      nist_800_53_r5: [CA-2, CA-7, PM-31]
      cis: []
    implementation:
      - policy:azurerm_management_group_policy_assignment.regulatory
      - policy:azurerm_subscription_policy_assignment.regulatory
    demo_safe: true
    billable: false
    notes: "Rev 5 and Rev 4 are different built-in initiatives. The GUID for Rev 4 (cf25b9c1-...) is documented in initiatives.tf specifically so it is not mistaken for Rev 5."

  - id: POL-004
    title: "CIS Microsoft Azure Foundations v3.0.0 initiative (GUID verification required)"
    module: policy
    enforcement: detective
    frameworks:
      fedramp: []
      nist_800_53_r5: [CA-2, CA-7]
      cis: ["1", "2", "3", "4", "5", "6", "7", "8", "9"]
    implementation:
      - policy:azurerm_management_group_policy_assignment.regulatory
      - policy:azurerm_subscription_policy_assignment.regulatory
    demo_safe: true
    billable: false
    notes: "NOT ASSIGNED BY DEFAULT. This repo ships no verified policy set definition GUID for the v3.0.0 built-in, and guessing one would assign the wrong benchmark version -- a green dashboard against the wrong control set is worse than no dashboard. Supply the GUID via var.builtin_initiative_id_overrides after confirming it with `az policy set-definition list`. The `initiatives_requiring_guid_verification` output reports the gap on every plan."

  - id: POL-005
    title: "Microsoft Cloud Security Benchmark initiative assigned explicitly"
    module: policy
    enforcement: detective
    frameworks:
      fedramp: [CA-7, CM-6]
      nist_800_53_r5: [CA-7, CM-6]
      cis: ["2"]
    implementation:
      - policy:azurerm_management_group_policy_assignment.regulatory
    demo_safe: true
    billable: false
    notes: "Often already present as the legacy 'ASC Default' subscription assignment. Re-assigning it at MG scope makes it explicit, versioned and visible in code."

  - id: POL-006
    title: "Deny resources outside approved regions"
    module: policy
    enforcement: preventive
    frameworks:
      fedramp: [SC-7, AC-4]
      nist_800_53_r5: [SC-7, AC-4, SA-9]
      cis: ["10"]
    implementation:
      - policy:azurerm_policy_definition.allowed_locations
    demo_safe: true
    billable: false
    notes: "A FedRAMP boundary is geographic. A resource created outside it is outside the boundary the moment it exists, and no detective control puts the data back."

  - id: POL-007
    title: "Deny virtual machines outside the approved SKU list"
    module: policy
    enforcement: preventive
    frameworks:
      fedramp: [CM-7]
      nist_800_53_r5: [CM-7, SA-22]
      cis: ["7"]
    implementation:
      - policy:azurerm_policy_definition.allowed_vm_skus
    demo_safe: true
    billable: false

  - id: POL-008
    title: "Deny resources missing required inventory tags"
    module: policy
    enforcement: preventive
    frameworks:
      fedramp: [CM-8]
      nist_800_53_r5: [CM-8, PM-5, RA-2]
      cis: ["10"]
    implementation:
      - policy:azurerm_policy_definition.required_tags
    demo_safe: true
    billable: false
    notes: "Uses the Azure Policy `count` expression over a parameterised tag list, so the required tag set is configuration rather than six copy-pasted policies."

  - id: POL-009
    title: "Deny storage accounts below the minimum TLS version"
    module: policy
    enforcement: preventive
    frameworks:
      fedramp: [SC-8, SC-13]
      nist_800_53_r5: ["SC-8", "SC-8(1)", "SC-13"]
      cis: ["3.12"]
    implementation:
      - policy:azurerm_policy_definition.min_tls_version
    demo_safe: true
    billable: false
    notes: "The built-in equivalents ship as Audit in several initiatives. A Deny is what stops TLS 1.0 being re-enabled by an engineer chasing a legacy client."

  - id: POL-010
    title: "Deny storage accounts that allow anonymous blob access"
    module: policy
    enforcement: preventive
    frameworks:
      fedramp: [AC-3, AC-22]
      nist_800_53_r5: [AC-3, AC-22]
      cis: ["3.7"]
    implementation:
      - policy:azurerm_policy_definition.deny_public_blob
    demo_safe: true
    billable: false

  - id: POL-011
    title: "Deny network interfaces with a directly attached public IP"
    module: policy
    enforcement: preventive
    frameworks:
      fedramp: [SC-7]
      nist_800_53_r5: ["SC-7", "SC-7(4)"]
      cis: ["6"]
    implementation:
      - policy:azurerm_policy_definition.deny_public_ip_nic
    demo_safe: true
    billable: false
    notes: "A NIC-attached public IP is an uninspected path around every hub firewall and NVA in the architecture."

  - id: POL-012
    title: "Custom guardrails packaged as one initiative with one assignment"
    module: policy
    enforcement: preventive
    frameworks:
      fedramp: [CM-6, CM-7]
      nist_800_53_r5: [CM-6, CM-7]
      cis: ["10"]
    implementation:
      - policy:azurerm_policy_set_definition.custom_guardrails
      - policy:azurerm_management_group_policy_assignment.custom_guardrails
      - policy:azurerm_subscription_policy_assignment.custom_guardrails
    demo_safe: true
    billable: false
    notes: "One assignment means one thing to exempt from, one compliance row to report, and one parameter set to tune -- instead of six independent assignments that drift apart."

  - id: POL-013
    title: "Policy effect is stageable from Audit to Deny without code changes"
    module: policy
    enforcement: preventive
    frameworks:
      fedramp: [CM-3, CM-4]
      nist_800_53_r5: [CM-3, CM-4, SA-11]
      cis: []
    implementation:
      - policy:azurerm_policy_set_definition.custom_guardrails
    demo_safe: true
    billable: false
    notes: "Every custom definition takes an `effect` parameter. A baseline that goes straight to Deny against a live tenant gets deleted by someone with Owner within a week."

  - id: POL-014
    title: "Documented, expiring policy exemptions"
    module: policy
    enforcement: preventive
    frameworks:
      fedramp: [CA-5, RA-3]
      nist_800_53_r5: [CA-5, RA-3, CM-3]
      cis: []
    implementation:
      - policy:azurerm_management_group_policy_exemption.this
      - policy:azurerm_subscription_policy_exemption.this
      - policy:azurerm_resource_policy_exemption.this
    demo_safe: true
    billable: false
    notes: "The variable schema forces a justification and an expiry. Azure stops honouring the exemption at the expiry date, so an unrenewed waiver fails closed instead of lasting forever."

  # =========================================================================
  # IAM - Azure RBAC. Entra ID controls are out of scope; see framework_notes.
  # =========================================================================
  - id: IAM-001
    title: "Dedicated, long-lived remediation identity for deployIfNotExists"
    module: policy
    enforcement: foundational
    frameworks:
      fedramp: [AC-2, AC-6]
      nist_800_53_r5: ["AC-2", "AC-2(7)", "AC-6"]
      cis: ["1"]
    implementation:
      - policy:azurerm_user_assigned_identity.remediation
    demo_safe: true
    billable: false
    notes: "User-assigned rather than system-assigned: a system-assigned identity is recreated on every re-assignment, orphaning its role assignments and silently breaking remediation."

  - id: IAM-002
    title: "Remediation identity scoped to the baseline scope, never tenant root"
    module: policy
    enforcement: preventive
    frameworks:
      fedramp: [AC-6]
      nist_800_53_r5: ["AC-6", "AC-6(1)", "AC-6(5)"]
      cis: ["1"]
    implementation:
      - policy:azurerm_role_assignment.remediation_contributor_mg
      - policy:azurerm_role_assignment.remediation_contributor_sub
    demo_safe: true
    billable: false
    notes: "Honest limitation: Microsoft's own FedRAMP and NIST initiatives contain remediation tasks that require Contributor. The mitigations are a non-interactive identity and a scope confined to the baseline MG or subscription. If your assessor will not accept Contributor here, run with enforcement DoNotEnforce and remediate through change control instead."

  - id: IAM-003
    title: "Defender configuration rights granted without Owner"
    module: policy
    enforcement: preventive
    frameworks:
      fedramp: [AC-6]
      nist_800_53_r5: ["AC-6", "AC-6(1)"]
      cis: ["1"]
    implementation:
      - policy:azurerm_role_assignment.remediation_security_admin_mg
      - policy:azurerm_role_assignment.remediation_security_admin_sub
    demo_safe: true
    billable: false

  - id: IAM-004
    title: "Diagnostic-settings remediation limited to monitoring roles"
    module: policy
    enforcement: preventive
    frameworks:
      fedramp: [AC-6, AU-12]
      nist_800_53_r5: ["AC-6(1)", "AU-12"]
      cis: ["5.1"]
    implementation:
      - policy:azurerm_role_assignment.remediation_monitoring_mg
      - policy:azurerm_role_assignment.remediation_monitoring_sub
    demo_safe: true
    billable: false

  - id: IAM-005
    title: "Read-only evidence access for assessors via Security Reader"
    module: root
    enforcement: preventive
    frameworks:
      fedramp: [AC-2, CA-2]
      nist_800_53_r5: ["AC-2", "AC-6(1)", "CA-2", "AU-6"]
      cis: ["1"]
    implementation:
      - root:azurerm_role_assignment.assessor_security_reader
    demo_safe: true
    billable: false
    notes: "Security Reader rather than Reader: it exposes findings, compliance state and secure score without granting data-plane read across the estate."

  - id: IAM-006
    title: "Key Vault in RBAC mode instead of access policies"
    module: encryption
    enforcement: preventive
    frameworks:
      fedramp: [AC-3, AC-6]
      nist_800_53_r5: [AC-3, AC-6, AU-6]
      cis: ["8"]
    implementation:
      - encryption:azurerm_key_vault.core
    demo_safe: true
    billable: false
    notes: "Access policies are a parallel authorization system invisible to `az role assignment list` and to PIM, which means AC-2 and AC-6 access reviews cannot see them at all."

  - id: IAM-007
    title: "Crypto identities hold wrap/unwrap only, not key read or export"
    module: encryption
    enforcement: preventive
    frameworks:
      fedramp: [AC-6, SC-12]
      nist_800_53_r5: ["AC-6(1)", "SC-12"]
      cis: ["8"]
    implementation:
      - encryption:azurerm_user_assigned_identity.cmk
      - encryption:azurerm_role_assignment.cmk_encryption_user
      - encryption:azurerm_role_assignment.des_encryption_user
    demo_safe: true
    billable: false

  - id: IAM-008
    title: "Deployment principal's key management rights scoped to one vault"
    module: encryption
    enforcement: preventive
    frameworks:
      fedramp: [CM-5, AC-6]
      nist_800_53_r5: ["CM-5", "AC-6(1)"]
      cis: ["8"]
    implementation:
      - encryption:azurerm_role_assignment.deployer_crypto_officer
      - encryption:data.azurerm_client_config.current
    demo_safe: true
    billable: false

  # =========================================================================
  # LOG - the audit substrate
  # =========================================================================
  - id: LOG-001
    title: "Single central Log Analytics workspace for the boundary"
    module: logging
    enforcement: foundational
    frameworks:
      fedramp: [AU-2, AU-3, AU-6]
      nist_800_53_r5: [AU-2, AU-3, AU-6, AU-12]
      cis: ["5.1"]
    implementation:
      - logging:azurerm_log_analytics_workspace.core
      - root:module.logging
    demo_safe: true
    billable: true
    notes: "Billable by ingestion volume and retention. This is usually the largest recurring line item in the baseline."

  - id: LOG-002
    title: "Audit retention window driven by the FedRAMP baseline"
    module: logging
    enforcement: foundational
    frameworks:
      fedramp: [AU-11]
      nist_800_53_r5: [AU-11, AU-4]
      cis: ["5.1"]
    implementation:
      - logging:azurerm_log_analytics_workspace.core
    demo_safe: true
    billable: true
    notes: "365 days interactive at Moderate, 730 at High, with the WORM archive carrying the multi-year tail. 730 days is the Log Analytics interactive maximum -- anything longer must live in the archive."

  - id: LOG-003
    title: "Subscription Activity Log captured to the central workspace"
    module: logging
    enforcement: detective
    frameworks:
      fedramp: [AU-2, AU-3, AU-12]
      nist_800_53_r5: [AU-2, AU-3, AU-12]
      cis: ["5.1"]
    implementation:
      - logging:azurerm_monitor_diagnostic_setting.activity_log
    demo_safe: true
    billable: true
    notes: "The platform retains the Activity Log for 90 days regardless. 90 days is shorter than the dwell time of most real intrusions, which is why this exists."

  - id: LOG-004
    title: "Audit records copied to a system the subscription owner cannot administer"
    module: logging
    enforcement: detective
    frameworks:
      fedramp: [AU-9]
      nist_800_53_r5: ["AU-9", "AU-9(2)"]
      cis: ["5.1"]
    implementation:
      - logging:azurerm_monitor_diagnostic_setting.activity_log_eventhub
    demo_safe: false
    billable: true
    notes: "Requires an existing Event Hub namespace. Off by default. Without this, an attacker with Owner on the subscription can eventually reach every copy of their own tracks."

  - id: LOG-005
    title: "deployIfNotExists policies attaching diagnostic settings by resource type"
    module: logging
    enforcement: preventive
    frameworks:
      fedramp: [AU-2, AU-12]
      nist_800_53_r5: [AU-2, AU-12, CM-6]
      cis: ["5.1"]
    implementation:
      - logging:azurerm_policy_definition.diagnostics
    demo_safe: true
    billable: false
    notes: "Metrics are requested per resource type, because asking a provider that publishes none for AllMetrics makes the nested deployment fail and produces a permanently non-compliant resource."

  - id: LOG-006
    title: "Diagnostics initiative assigned with a remediation identity"
    module: logging
    enforcement: preventive
    frameworks:
      fedramp: [AU-12, CM-6]
      nist_800_53_r5: [AU-12, CM-6]
      cis: ["5.1"]
    implementation:
      - logging:azurerm_policy_set_definition.diagnostics
      - logging:azurerm_management_group_policy_assignment.diagnostics
      - logging:azurerm_subscription_policy_assignment.diagnostics
    demo_safe: true
    billable: false
    notes: "Pre-existing resources are only fixed once a remediation task is run: `az policy remediation create`. Terraform creates the policy, not the remediation run."

  - id: LOG-007
    title: "Key Vault audit events captured"
    module: logging
    enforcement: detective
    frameworks:
      fedramp: [AU-2, AU-6]
      nist_800_53_r5: [AU-2, AU-6, SC-12]
      cis: ["8.5"]
    implementation:
      - logging:azurerm_monitor_diagnostic_setting.key_vault
    demo_safe: true
    billable: true
    notes: "Lives in the logging module rather than the encryption module: routing it from encryption would make encryption depend on logging while logging already depends on encryption for the CMK, which Terraform cannot resolve."

  - id: LOG-008
    title: "The audit archive's own control plane is audited"
    module: logging
    enforcement: detective
    frameworks:
      fedramp: [AU-9]
      nist_800_53_r5: ["AU-9", "AU-6(3)"]
      cis: ["5.1"]
    implementation:
      - logging:azurerm_monitor_diagnostic_setting.archive_account
    demo_safe: true
    billable: true
    notes: "An attempt to weaken the immutability policy shows up here. Auditing the audit store is not paranoia; it is the only way AU-9 is testable."

  - id: LOG-009
    title: "Ingestion cap is opt-in and its consequence is stated"
    module: logging
    enforcement: foundational
    frameworks:
      fedramp: [AU-4, AU-5]
      nist_800_53_r5: [AU-4, AU-5]
      cis: []
    implementation:
      - logging:azurerm_log_analytics_workspace.core
    demo_safe: true
    billable: true
    notes: "A daily quota protects the bill by DROPPING audit records once hit, not by queuing them. Defaults to uncapped. The Conftest policy in policies/audit_retention.rego warns whenever a cap is set."

  # =========================================================================
  # DET - detection, alerting and continuous monitoring
  # =========================================================================
  - id: DET-001
    title: "Defender for Cloud plans behind individual enable_* switches"
    module: defender
    enforcement: detective
    frameworks:
      fedramp: [RA-5, SI-4]
      nist_800_53_r5: [RA-5, SI-4, CA-7]
      cis: ["2.1"]
    implementation:
      - defender:azurerm_security_center_subscription_pricing.this
      - root:module.defender
    demo_safe: false
    billable: true
    notes: "Nine plans, each metered per resource per month, each defaulting to false. Enabling all of them across a real estate is a four-to-five figure monthly bill."

  - id: DET-002
    title: "Defender for Servers tier selected by the FedRAMP baseline"
    module: defender
    enforcement: detective
    frameworks:
      fedramp: [RA-5, SI-7]
      nist_800_53_r5: ["RA-5", "SI-7", "SI-7(1)"]
      cis: ["2.1"]
    implementation:
      - defender:azurerm_security_center_subscription_pricing.this
    demo_safe: false
    billable: true
    notes: "P1 at Moderate is agentless posture only. P2 at High adds agent-based vulnerability assessment and file integrity monitoring, which is what RA-5 and SI-7 actually ask for."

  - id: DET-003
    title: "Malware scanning and sensitive data discovery on storage at the High baseline"
    module: defender
    enforcement: detective
    frameworks:
      fedramp: [SI-3, RA-2]
      nist_800_53_r5: [SI-3, RA-2, SI-4]
      cis: ["2.1"]
    implementation:
      - defender:azurerm_security_center_subscription_pricing.this
    demo_safe: false
    billable: true
    notes: "Metered per GB scanned. Off at Moderate because the per-GB charge on a high-throughput data lake is substantial and RA-2 lets you make that call from the data classification."

  - id: DET-004
    title: "Security contacts so high-severity alerts reach a human"
    module: defender
    enforcement: detective
    frameworks:
      fedramp: [IR-6, SI-4]
      nist_800_53_r5: ["IR-6", "IR-6(1)", "SI-4(5)"]
      cis: ["2"]
    implementation:
      - defender:azurerm_security_center_contact.this
    demo_safe: false
    billable: false
    notes: "An alert nobody is paged for is a log entry."

  - id: DET-005
    title: "Monitoring agent auto-provisioning for server telemetry"
    module: defender
    enforcement: detective
    frameworks:
      fedramp: [SI-4]
      nist_800_53_r5: ["SI-4", "SI-4(2)"]
      cis: ["2"]
    implementation:
      - defender:azurerm_security_center_auto_provisioning.this
    demo_safe: false
    billable: true
    notes: "Covers the legacy Log Analytics agent setting. Microsoft has retired MMA auto-provisioning in favour of the Azure Monitor Agent delivered by policy (LOG-005/006); both exist here because tenants are mid-migration for a long time."

  - id: DET-006
    title: "Defender findings land in the same workspace as the Activity Log"
    module: defender
    enforcement: detective
    frameworks:
      fedramp: [AU-6]
      nist_800_53_r5: ["AU-6", "AU-6(3)"]
      cis: ["2"]
    implementation:
      - defender:azurerm_security_center_workspace.this
    demo_safe: false
    billable: true
    notes: "Without co-location, the hunting query joining 'suspicious sign-in' to 'role assignment created' to 'storage firewall opened' cannot be written."

  - id: DET-007
    title: "Continuous export of alerts, assessments and secure score"
    module: defender
    enforcement: detective
    frameworks:
      fedramp: [CA-7, AU-11]
      nist_800_53_r5: ["CA-7", "AU-11", "AU-6(3)"]
      cis: ["2"]
    implementation:
      - defender:azurerm_security_center_automation.to_log_analytics
    demo_safe: false
    billable: true
    notes: "The Defender portal keeps findings for a rolling window only. 'Show me the secure score trend for the last six months' needs a table, not a screenshot."

  - id: DET-008
    title: "Findings streamed to an external SIEM via Event Hub"
    module: defender
    enforcement: detective
    frameworks:
      fedramp: [AU-9, IR-4]
      nist_800_53_r5: ["AU-9(2)", "IR-4", "SI-4"]
      cis: []
    implementation:
      - defender:azurerm_security_center_automation.to_event_hub
    demo_safe: false
    billable: true
    notes: "Requires an Event Hub resource ID and a send-only connection string, supplied as a sensitive variable. No credential is stored in this repository."

  - id: DET-009
    title: "Custom Defender assessment for un-locked WORM policies"
    module: defender
    enforcement: detective
    frameworks:
      fedramp: [AU-9]
      nist_800_53_r5: ["AU-9", "AU-9(3)"]
      cis: ["3"]
    implementation:
      - defender:azurerm_security_center_assessment_policy.worm_lock
    demo_safe: false
    billable: false
    notes: "Microsoft ships no assessment for 'the immutability policy exists but is Unlocked', which is exactly the state a first Terraform apply leaves you in."

  - id: DET-010
    title: "Defender for Endpoint and Cloud Apps integrations set explicitly"
    module: defender
    enforcement: detective
    frameworks:
      fedramp: [SI-4, SI-3]
      nist_800_53_r5: [SI-3, SI-4]
      cis: ["2"]
    implementation:
      - defender:azurerm_security_center_setting.mcas
      - defender:azurerm_security_center_setting.wdatp
    demo_safe: false
    billable: true
    notes: "Each integration is a data-sharing decision. Declaring it in code beats leaving it at whatever the subscription defaulted to years ago."

  - id: DET-011
    title: "Activity Log alerts on control-plane operations that weaken the baseline"
    module: logging
    enforcement: detective
    frameworks:
      fedramp: [AU-6, SI-4, CM-3]
      nist_800_53_r5: ["AU-6(1)", "SI-4(5)", "CM-3", "AC-2(4)"]
      cis: ["5.2"]
    implementation:
      - logging:azurerm_monitor_activity_log_alert.control_plane
    demo_safe: true
    billable: false
    notes: "Eight alerts: policy assignment write/delete, NSG and NSG-rule write, Key Vault delete, Defender pricing change, role assignment write, diagnostic setting delete. These are the operations an attacker performs to become persistent or invisible."

  - id: DET-012
    title: "Action group routing security alerts to named recipients"
    module: logging
    enforcement: detective
    frameworks:
      fedramp: [IR-6]
      nist_800_53_r5: ["IR-6", "AU-6(1)"]
      cis: ["5.2"]
    implementation:
      - logging:azurerm_monitor_action_group.security
    demo_safe: true
    billable: false
    notes: "An empty recipient list is a valid deployment and an invalid control: the alerts still fire and remain queryable, but nothing is pushed to anyone."

  # =========================================================================
  # ENC - cryptography and key management
  # =========================================================================
  - id: ENC-001
    title: "Key Vault with purge protection and maximum soft-delete window"
    module: encryption
    enforcement: foundational
    frameworks:
      fedramp: [SC-12, CP-9]
      nist_800_53_r5: ["SC-12", "SC-12(1)", "CP-9"]
      cis: ["8"]
    implementation:
      - encryption:azurerm_key_vault.core
      - root:module.encryption
    demo_safe: true
    billable: true
    notes: "Purge protection cannot be turned off once enabled -- that is the point. Without it a compromised Owner can delete and purge the vault inside the soft-delete window, permanently destroying every CMK and every volume they protect."

  - id: ENC-002
    title: "HSM-backed customer-managed keys, one per data domain"
    module: encryption
    enforcement: foundational
    frameworks:
      fedramp: [SC-12, SC-13, SC-28]
      nist_800_53_r5: ["SC-12", "SC-13", "SC-28", "SC-28(1)"]
      cis: ["8"]
    implementation:
      - encryption:azurerm_key_vault_key.cmk
    demo_safe: true
    billable: true
    notes: "RSA-HSM on a Premium vault: FIPS 140-2 Level 3. Separate keys for storage, disks and SQL so that rotating or destroying one does not take the others offline."

  - id: ENC-003
    title: "Automatic key rotation on a baseline-driven cryptographic period"
    module: encryption
    enforcement: foundational
    frameworks:
      fedramp: [SC-12]
      nist_800_53_r5: ["SC-12", "SC-12(1)"]
      cis: ["8.1"]
    implementation:
      - encryption:azurerm_key_vault_key.cmk
    demo_safe: true
    billable: true
    notes: "P365D at Moderate, P180D at High, with automatic rotation rather than a documented manual procedure. A manual rotation procedure is a procedure that stops happening in month 14."

  - id: ENC-004
    title: "Disk encryption set with double encryption at the High baseline"
    module: encryption
    enforcement: preventive
    frameworks:
      fedramp: [SC-28]
      nist_800_53_r5: ["SC-28", "SC-28(1)"]
      cis: ["7"]
    implementation:
      - encryption:azurerm_disk_encryption_set.this
    demo_safe: true
    billable: true
    notes: "Moderate uses EncryptionAtRestWithCustomerKey; High uses EncryptionAtRestWithPlatformAndCustomerKeys -- two independent layers. Attaching the set to disks is the workload team's job; this module publishes the ID."

  - id: ENC-005
    title: "Audit archive encrypted with a customer-controlled key"
    module: logging
    enforcement: preventive
    frameworks:
      fedramp: [SC-28, MP-6]
      nist_800_53_r5: ["SC-28(1)", "MP-6", "SC-12"]
      cis: ["3"]
    implementation:
      - logging:azurerm_storage_account.archive
    demo_safe: true
    billable: true
    notes: "You cannot shred a disk you do not own. Destroying the CMK is the sanitisation path that makes MP-6 achievable in a cloud."

  - id: ENC-006
    title: "Infrastructure-level double encryption on stored audit records"
    module: logging
    enforcement: preventive
    frameworks:
      fedramp: [SC-28]
      nist_800_53_r5: ["SC-28", "SC-28(1)"]
      cis: ["3.2"]
    implementation:
      - logging:azurerm_storage_account.archive
      - network:azurerm_storage_account.flow_logs
    demo_safe: true
    billable: true

  # =========================================================================
  # NET - boundary protection
  # =========================================================================
  - id: NET-001
    title: "Baseline network security group applied to workload subnets"
    module: network
    enforcement: preventive
    frameworks:
      fedramp: [SC-7]
      nist_800_53_r5: [SC-7, AC-4]
      cis: ["6"]
    implementation:
      - network:azurerm_network_security_group.baseline
      - network:azurerm_subnet_network_security_group_association.workload
      - root:module.network
    demo_safe: true
    billable: false

  - id: NET-002
    title: "Remote management and database ports denied from the internet"
    module: network
    enforcement: preventive
    frameworks:
      fedramp: [AC-17, SC-7]
      nist_800_53_r5: ["AC-17", "AC-17(1)", "SC-7"]
      cis: ["6.1", "6.2"]
    implementation:
      - network:azurerm_network_security_rule.deny_internet_management
    demo_safe: true
    billable: false
    notes: "Priority 100 so it wins over anything a workload team adds later. Covers 22, 3389, WinRM, and the four database ports that turn up exposed most often."

  - id: NET-003
    title: "Explicit terminal deny on inbound traffic"
    module: network
    enforcement: preventive
    frameworks:
      fedramp: [SC-7]
      nist_800_53_r5: ["SC-7", "SC-7(5)"]
      cis: ["6"]
    implementation:
      - network:azurerm_network_security_rule.deny_all_inbound
      - network:azurerm_network_security_rule.allow_vnet_inbound
    demo_safe: true
    billable: false
    notes: "The explicit deny at priority 4096 out-ranks Azure's implicit AllowVnetInBound at 65000, so a companion allow rule at 3900 restates intra-VNet reachability above it -- without that, the baseline NSG would black-hole private endpoint traffic. Redundant with Azure's implicit rule at 65500 by design. An assessor reading the rule list sees the intent; a future engineer cannot out-prioritise a rule they cannot see."

  - id: NET-004
    title: "Opt-in deny on unrestricted internet egress"
    module: network
    enforcement: preventive
    frameworks:
      fedramp: [SC-7]
      nist_800_53_r5: ["SC-7(4)", "SC-7(5)", "AC-4"]
      cis: ["6"]
    implementation:
      - network:azurerm_network_security_rule.deny_internet_egress
    demo_safe: true
    billable: false
    notes: "Off by default. Turning it on without a firewall or private-endpoint path first breaks agent enrolment, Windows Update and Key Vault access -- and a baseline that bricks a tenant on first apply gets removed rather than fixed."

  - id: NET-005
    title: "Network Watcher present in the region"
    module: network
    enforcement: detective
    frameworks:
      fedramp: [AU-12, SI-4]
      nist_800_53_r5: ["AU-12", "SI-4(4)"]
      cis: ["6.5"]
    implementation:
      - network:azurerm_network_watcher.this
    demo_safe: true
    billable: false
    notes: "Azure auto-creates one per region in most tenants. Set enable_network_watcher = false to adopt the existing instance instead of colliding with it."

  - id: NET-006
    title: "NSG flow logs with traffic analytics"
    module: network
    enforcement: detective
    frameworks:
      fedramp: [AU-2, AU-12, SI-4]
      nist_800_53_r5: ["AU-2", "AU-12", "SI-4(4)"]
      cis: ["6.6"]
    implementation:
      - network:azurerm_network_watcher_flow_log.baseline
      - network:azurerm_storage_account.flow_logs
    demo_safe: false
    billable: true
    notes: "Version 2 flow logs for byte and packet counts. Traffic analytics is what makes them reviewable -- without it you have gigabytes of JSON nobody will open."

  - id: NET-007
    title: "Private endpoints for the Key Vault and the audit archive"
    module: network
    enforcement: preventive
    frameworks:
      fedramp: [SC-7]
      nist_800_53_r5: ["SC-7", "SC-7(3)"]
      cis: ["8.6"]
    implementation:
      - network:azurerm_private_endpoint.key_vault
      - network:azurerm_private_endpoint.archive_blob
    demo_safe: false
    billable: true

  - id: NET-008
    title: "Cloud-correct private DNS zones linked to the platform VNet"
    module: network
    enforcement: preventive
    frameworks:
      fedramp: [SC-7, SC-20]
      nist_800_53_r5: ["SC-7(3)", "SC-20", "SC-21"]
      cis: ["6"]
    implementation:
      - network:azurerm_private_dns_zone.this
      - network:azurerm_private_dns_zone_virtual_network_link.this
    demo_safe: false
    billable: true
    notes: "Zone suffixes differ between commercial and Gov clouds. Getting this wrong makes clients resolve the public name to a public IP -- the private endpoint becomes an unused NIC and traffic quietly keeps traversing the internet."

  - id: NET-009
    title: "Private endpoint subnet keeps network policies enabled"
    module: network
    enforcement: preventive
    frameworks:
      fedramp: [SC-7]
      nist_800_53_r5: ["SC-7", "SC-7(3)"]
      cis: ["6"]
    implementation:
      - network:azurerm_subnet.private_endpoints
      - network:azurerm_virtual_network.platform
      - network:azurerm_subnet.workload
      - network:azurerm_subnet_network_security_group_association.private_endpoints
    demo_safe: true
    billable: false
    notes: "The historical default disabled NSG evaluation on private endpoint traffic, which is a common and invisible blind spot."

  - id: NET-010
    title: "DDoS Network Protection plan"
    module: network
    enforcement: preventive
    frameworks:
      fedramp: [SC-5]
      nist_800_53_r5: ["SC-5", "SC-5(1)"]
      cis: ["6"]
    implementation:
      - network:azurerm_network_ddos_protection_plan.this
    demo_safe: false
    billable: true
    notes: "Roughly USD 2,900/month per tenant regardless of how many VNets use it. The single most expensive switch in this repository, and off by default."

  - id: NET-011
    title: "NSG rule change history captured"
    module: network
    enforcement: detective
    frameworks:
      fedramp: [AU-2, CM-3]
      nist_800_53_r5: [AU-2, CM-3, SC-7]
      cis: ["5.1"]
    implementation:
      - network:azurerm_monitor_diagnostic_setting.nsg
    demo_safe: true
    billable: true

  # =========================================================================
  # DAT - data protection and audit record integrity
  # =========================================================================
  - id: DAT-001
    title: "Write-once, read-many immutability on the audit archive"
    module: logging
    enforcement: preventive
    frameworks:
      fedramp: [AU-9, AU-11]
      nist_800_53_r5: ["AU-9", "AU-9(3)", "AU-11"]
      cis: ["3"]
    implementation:
      - logging:azurerm_storage_account.archive
      - logging:azurerm_storage_container.archive
    demo_safe: true
    billable: true
    notes: "Created in Unlocked state. Unlocked means an Owner can still shorten or remove it, and an assessor will treat that as a finding. Locking is irreversible for the life of the account -- not even Microsoft can undo it -- so it is a documented manual step, not something a first apply does to you."

  - id: DAT-002
    title: "Blob versioning and change feed on the audit archive"
    module: logging
    enforcement: preventive
    frameworks:
      fedramp: [SI-12, AU-9]
      nist_800_53_r5: ["SI-12", "AU-9", "AU-6(3)"]
      cis: ["3"]
    implementation:
      - logging:azurerm_storage_account.archive
    demo_safe: true
    billable: true
    notes: "Versioning is a prerequisite for account-level immutability. The change feed is an ordered, durable log of every blob mutation -- the audit trail of the audit archive itself."

  - id: DAT-003
    title: "Blob and container soft delete windows"
    module: logging
    enforcement: preventive
    frameworks:
      fedramp: [CP-9, SI-12]
      nist_800_53_r5: [CP-9, SI-12]
      cis: ["3"]
    implementation:
      - logging:azurerm_storage_account.archive
    demo_safe: true
    billable: true
    notes: "30 days at Moderate, 90 at High."

  - id: DAT-004
    title: "Geo-redundant audit archive with a readable secondary at High"
    module: logging
    enforcement: preventive
    frameworks:
      fedramp: [CP-9, CP-10]
      nist_800_53_r5: ["CP-9", "CP-10", "CP-6"]
      cis: ["3"]
    implementation:
      - logging:azurerm_storage_account.archive
    demo_safe: true
    billable: true
    notes: "GRS at Moderate, RAGRS at High so the secondary copy is readable during a regional outage rather than only after a failover is declared."

  - id: DAT-005
    title: "Shared key authentication disabled on the audit archive"
    module: logging
    enforcement: preventive
    frameworks:
      fedramp: [AC-3, IA-2]
      nist_800_53_r5: ["AC-3", "IA-2", "IA-5"]
      cis: ["3"]
    implementation:
      - logging:azurerm_storage_account.archive
    demo_safe: true
    billable: false
    notes: "Storage account keys are bearer credentials that cannot be scoped, rotated per-principal, or attributed to a human in the audit log. The flow log sink is a documented exception -- Network Watcher delivery requires shared key -- and the Conftest policy encodes that exception by tag, not by name."

  - id: DAT-006
    title: "SAS token lifetime capped at one hour"
    module: logging
    enforcement: preventive
    frameworks:
      fedramp: [AC-3, SC-12]
      nist_800_53_r5: ["AC-3", "IA-5", "SC-12"]
      cis: ["3.3"]
    implementation:
      - logging:azurerm_storage_account.archive
      - network:azurerm_storage_account.flow_logs
    demo_safe: true
    billable: false
    notes: "A long-lived SAS is an unrevocable credential that no directory sees."

  - id: DAT-007
    title: "Lifecycle tiering keeps long retention affordable"
    module: logging
    enforcement: foundational
    frameworks:
      fedramp: [AU-4, AU-11]
      nist_800_53_r5: [AU-4, AU-11]
      cis: []
    implementation:
      - logging:azurerm_storage_management_policy.archive
    demo_safe: true
    billable: true
    notes: "Deliberately has no delete action: the WORM policy owns the lifetime. A lifecycle delete racing an immutability policy produces a permanently failing rule and a misleading 'policy applied' status."

  - id: DAT-008
    title: "Storage and Key Vault firewalls default to deny"
    module: encryption
    enforcement: preventive
    frameworks:
      fedramp: [SC-7, AC-3]
      nist_800_53_r5: ["SC-7", "SC-7(5)", "AC-3"]
      cis: ["3", "8"]
    implementation:
      - encryption:azurerm_key_vault.core
      - logging:azurerm_storage_account.archive
      - network:azurerm_storage_account.flow_logs
    demo_safe: true
    billable: false
    notes: "The AzureServices bypass is required for Log Analytics and Defender continuous export to reach the archive at all, and for the disk encryption set to unwrap its key. It is a real widening of the boundary and is called out rather than buried."
